<div class="jd-proof-section" dir="rtl">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
    .jd-proof-section{
      position:relative;
      isolation:isolate;
      --gold:#8a6826;
      --brand-gold:#d7bb5b;
      --gold2:#f2de9a;
      --text:#332b22;
      --muted:#706047;
      font-family:'Cairo',Tahoma,Arial,sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255,254,246,.88), transparent 48%),
        radial-gradient(ellipse at 0% 50%, rgba(220,187,106,.12), transparent 55%),
        linear-gradient(135deg, #f8edcf 0%, #f0dfb2 52%, #f9edce 100%);
      color:var(--text);
      padding:40px 16px 50px;
    }
    .jd-proof-section *{ box-sizing:border-box; }
    /* رمز الشعار فقط: باتيرن متباعد فوق الخلفية الذهبية */
    .jd-proof-pattern{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:0;
      overflow:hidden;
      pointer-events:none;
      mix-blend-mode:multiply;
      opacity:.28;
    }
    .jd-proof-wrap{
      position:relative;
      z-index:1;
      max-width:1280px;
      margin:0 auto;
    }
    /* ===== الشعار واسم المتجر ===== */
    .jd-brand-hero{
      text-align:center;
      padding:34px 18px 28px;
      border:1px solid rgba(170,133,52,.19);
      border-radius:34px;
      background:linear-gradient(145deg, rgba(255,253,246,.91), rgba(255,249,231,.83));
      box-shadow:0 18px 48px rgba(117,87,31,.07), inset 0 1px 0 rgba(255,255,255,.75);
      margin-bottom:26px;
      overflow:hidden;
      position:relative;
    }
    .jd-brand-hero:before,
    .jd-brand-hero:after{
      content:"";
      position:absolute;
      width:240px; height:240px;
      border-radius:50%;
      filter:blur(30px);
      opacity:.16;
      pointer-events:none;
    }
    .jd-brand-hero:before{ top:-120px; left:-70px; background:rgba(215,184,90,.8); }
    .jd-brand-hero:after{ bottom:-120px; right:-70px; background:rgba(255,255,255,.25); }
    .jd-brand-logo{
      width:140px; height:140px;
      margin:0 auto 14px;
      border-radius:28px;
      padding:14px;
      display:grid;
      place-items:center;
      background:linear-gradient(145deg, #fffefa, #f8edcf);
      border:1px solid rgba(160,123,40,.16);
      box-shadow:0 16px 36px rgba(105,79,26,.12);
      position:relative;
      z-index:1;
    }
    .jd-brand-mark{ width:84px; height:65px; display:block; overflow:hidden; }
    .jd-brand-hero h1{
      margin:0;
      font-size:clamp(2rem, 4vw, 3.6rem);
      font-weight:800;
      color:var(--text);
      line-height:1.2;
      position:relative; z-index:1;
    }
    .jd-brand-hero .en{
      display:block;
      margin-top:10px;
      color:var(--gold);
      letter-spacing:.22em;
      font-size:.9rem;
      font-weight:700;
      position:relative; z-index:1;
    }
    .jd-brand-hero p{
      margin:12px auto 0;
      max-width:850px;
      color:var(--muted);
      line-height:2;
      font-size:1rem;
      position:relative; z-index:1;
    }
    /* ===== التبويبات (CSS فقط) ===== */
    .jd-radio{
      position:absolute;
      opacity:0;
      pointer-events:none;
      width:0; height:0;
    }
    .jd-tabs-nav{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:24px;
    }
    .jd-tab-btn{
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-width:240px;
      padding:16px 26px;
      border-radius:999px;
      font-weight:800;
      font-size:1.1rem;
      color:var(--text);
      background:#fffdf7;
      border:1px solid rgba(215,184,90,.28);
      transition:.25s ease;
      user-select:none;
    }
    .jd-tab-btn:hover{
      transform:translateY(-2px);
      background:rgba(215,184,90,.10);
      border-color:rgba(215,184,90,.5);
    }
    .jd-tab-btn .count{
      background:rgba(160,123,40,.16);
      color:var(--gold);
      border-radius:999px;
      padding:2px 12px;
      font-size:.85rem;
      font-weight:700;
    }
    #jd-tab-reviews:checked ~ .jd-tabs-nav label[for="jd-tab-reviews"],
    #jd-tab-ba:checked ~ .jd-tabs-nav label[for="jd-tab-ba"]{
      background:linear-gradient(135deg, var(--brand-gold), var(--gold2));
      color:#111;
      border-color:transparent;
      box-shadow:0 12px 28px rgba(215,184,90,.28);
    }
    #jd-tab-reviews:checked ~ .jd-tabs-nav label[for="jd-tab-reviews"] .count,
    #jd-tab-ba:checked ~ .jd-tabs-nav label[for="jd-tab-ba"] .count{
      background:rgba(255,255,255,.48);
      color:#111;
    }
    /* ===== الأقسام ===== */
    .jd-panel{ display:none; }
    #jd-tab-reviews:checked ~ .jd-panels .jd-panel-reviews{ display:block; animation:jdFade .45s ease; }
    #jd-tab-ba:checked ~ .jd-panels .jd-panel-ba{ display:block; animation:jdFade .45s ease; }
    @keyframes jdFade{
      from{ opacity:0; transform:translateY(14px); }
      to{ opacity:1; transform:translateY(0); }
    }
    .jd-proof-block{
      background:linear-gradient(145deg, rgba(255,253,246,.91), rgba(255,249,231,.83));
      border:1px solid rgba(170,133,52,.19);
      border-radius:30px;
      padding:22px;
      box-shadow:0 18px 48px rgba(117,87,31,.07), inset 0 1px 0 rgba(255,255,255,.75);
    }
    .jd-block-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:18px;
      flex-wrap:wrap;
    }
    .jd-block-title h2{ margin:0; font-size:1.4rem; color:var(--text); font-weight:800; }
    .jd-block-title span{ color:var(--gold); font-weight:700; font-size:.92rem; }
    .jd-gallery-grid{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:14px;
    }
    /* نفس نسبة 1448 × 1086 مع تصغير العرض حسب مساحة الشاشة */
    .jd-gallery-item{
      width:100%;
      min-width:0;
      aspect-ratio:1448 / 1086;
      position:relative;
      overflow:hidden;
      border-radius:18px;
      border:1px solid rgba(160,123,40,.24);
      background:#fffdf7;
      box-shadow:0 10px 24px rgba(105,79,26,.08);
      cursor:zoom-in;
      transition:.3s ease;
    }
    .jd-gallery-item:hover{
      transform:translateY(-4px);
      border-color:rgba(215,184,90,.55);
      box-shadow:0 16px 34px rgba(160,123,40,.16);
    }
    .jd-gallery-item img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:contain;
      background:#fffdf7;
    }
    .jd-gallery-item:after{
      content:"⤢";
      position:absolute;
      bottom:10px; left:10px;
      width:34px; height:34px;
      display:grid; place-items:center;
      border-radius:50%;
      background:rgba(255,253,247,.95);
      color:var(--gold);
      border:1px solid rgba(215,184,90,.35);
      font-size:1rem;
      opacity:0;
      transition:.25s ease;
      pointer-events:none;
    }
    .jd-gallery-item:hover:after{ opacity:1; }
    /* ===== التكبير ===== */
    .jd-lightbox{
      position:fixed;
      inset:0;
      z-index:999999;
      background:rgba(250,242,220,.98);
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      direction:ltr;
    }
    .jd-lightbox.open{ display:flex; }
    .jd-lightbox img{
      max-width:92vw;
      max-height:86vh;
      border-radius:14px;
      border:1px solid rgba(215,184,90,.3);
      box-shadow:0 20px 60px rgba(105,79,26,.16);
      object-fit:contain;
    }
    .jd-lb-btn{
      position:absolute;
      width:48px; height:48px;
      border-radius:50%;
      border:1px solid rgba(215,184,90,.45);
      background:#fffdf7;
      color:#78591f;
      font-size:1.8rem;
      line-height:1;
      cursor:pointer;
      display:grid; place-items:center;
      transition:.2s ease;
      font-family:Arial,sans-serif;
    }
    .jd-lb-btn:hover{ background:#d7b85a; color:#111; }
    .jd-lb-close{ top:18px; right:18px; }
    .jd-lb-prev{ left:18px; top:50%; transform:translateY(-50%); }
    .jd-lb-next{ right:18px; top:50%; transform:translateY(-50%); }
    .jd-lb-count{
      position:absolute;
      bottom:18px; left:50%;
      transform:translateX(-50%);
      color:#78591f;
      font-family:'Cairo',Arial,sans-serif;
      font-weight:700;
      background:rgba(105,79,26,.16);
      padding:6px 16px;
      border-radius:999px;
      border:1px solid rgba(215,184,90,.3);
    }
    /* ===== الجوال ===== */
    @media (max-width: 760px){
      .jd-proof-pattern{ opacity:.24; }
      .jd-brand-mark{ width:76px; height:59px; }
      .jd-gallery-grid{ grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; }
      .jd-brand-logo{ width:120px; height:120px; }
      .jd-tab-btn{ min-width:100%; }
      .jd-proof-block{ padding:12px; }
      .jd-gallery-item{ border-radius:10px; }
    }

  <script>
    (function(){
      var root = document.querySelector('.jd-proof-section');
      if(!root) return;
      var box = document.createElement('div');
      box.className = 'jd-lightbox';
      box.innerHTML =
        '<button type="button" class="jd-lb-btn jd-lb-close" aria-label="إغلاق">&times;</button>' +
        '<button type="button" class="jd-lb-btn jd-lb-prev" aria-label="السابق">&#8249;</button>' +
        '<img alt="">' +
        '<button type="button" class="jd-lb-btn jd-lb-next" aria-label="التالي">&#8250;</button>' +
        '<div class="jd-lb-count"></div>';
      document.body.appendChild(box);
      var big = box.querySelector('img');
      var counter = box.querySelector('.jd-lb-count');
      var list = [], idx = 0;
      function show(i){
        idx = i;
        big.src = list[i].src;
        big.alt = list[i].alt || '';
        counter.textContent = (i + 1) + ' / ' + list.length;
        box.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      function hide(){
        box.classList.remove('open');
        document.body.style.overflow = '';
      }
      function step(d){
        show((idx + d + list.length) % list.length);
      }
      root.addEventListener('click', function(e){
        var img = e.target.closest ? e.target.closest('.jd-gallery-item img') : null;
        if(!img) return;
        var grid = img.closest('.jd-gallery-grid');
        list = [].slice.call(grid.querySelectorAll('img'));
        show(list.indexOf(img));
      });
      box.querySelector('.jd-lb-close').addEventListener('click', hide);
      box.querySelector('.jd-lb-prev').addEventListener('click', function(e){ e.stopPropagation(); step(-1); });
      box.querySelector('.jd-lb-next').addEventListener('click', function(e){ e.stopPropagation(); step(1); });
      box.addEventListener('click', function(e){ if(e.target === box) hide(); });
      document.addEventListener('keydown', function(e){
        if(!box.classList.contains('open')) return;
        if(e.key === 'Escape') hide();
        if(e.key === 'ArrowLeft') step(-1);
        if(e.key === 'ArrowRight') step(1);
      });
    })();
  </script>
